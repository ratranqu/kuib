# PostgreSQL deployment for KUIB data persistence
apiVersion: v1
kind: Secret
metadata:
  name: kuib-postgres-credentials
  namespace: kuib
  labels:
    app.kubernetes.io/name: kuib
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_DB: kuib
  POSTGRES_USER: kuib
  POSTGRES_PASSWORD: changeme-in-production
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kuib-postgres-data
  namespace: kuib
  labels:
    app.kubernetes.io/name: kuib
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuib-postgres
  namespace: kuib
  labels:
    app.kubernetes.io/name: kuib
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuib
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuib
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: kuib-postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kuib"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kuib"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kuib-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: kuib-postgres
  namespace: kuib
  labels:
    app.kubernetes.io/name: kuib
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: kuib
    app.kubernetes.io/component: database
  ports:
    - port: 5432
      targetPort: 5432
