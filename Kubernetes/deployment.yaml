apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuib
  namespace: kuib
  labels:
    app.kubernetes.io/name: kuib
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuib
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuib
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: kuib
      containers:
        - name: kuib
          image: kuib:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KUIB_HOST
              value: "0.0.0.0"
            - name: KUIB_PORT
              value: "8080"
            - name: KUIB_LOG_LEVEL
              value: "info"
            - name: KUIB_DB_HOST
              value: "kuib-postgres"
            - name: KUIB_DB_PORT
              value: "5432"
            - name: KUIB_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: kuib-postgres-credentials
                  key: POSTGRES_DB
            - name: KUIB_DB_USER
              valueFrom:
                secretKeyRef:
                  name: kuib-postgres-credentials
                  key: POSTGRES_USER
            - name: KUIB_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuib-postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: KUIB_LOG_RETENTION_DAYS
              value: "30"
            - name: KUIB_EVENT_RETENTION_DAYS
              value: "14"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
