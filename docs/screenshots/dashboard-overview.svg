<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#f3f4f6" rx="8"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="200" height="600" fill="#1e293b" rx="8"/>
  <rect x="8" y="0" width="192" height="600" fill="#1e293b"/>
  <text x="24" y="36" fill="#fff" font-size="18" font-weight="bold">KUIB</text>
  <text x="24" y="52" fill="#94a3b8" font-size="10">Kubernetes Dashboard</text>

  <!-- Sidebar items -->
  <rect x="12" y="68" width="176" height="32" fill="#3b82f6" rx="6"/>
  <text x="24" y="89" fill="#fff" font-size="13">Dashboard</text>
  <text x="24" y="120" fill="#94a3b8" font-size="11">OVERVIEW</text>
  <text x="24" y="142" fill="#cbd5e1" font-size="13">Namespaces</text>
  <text x="24" y="168" fill="#94a3b8" font-size="11">WORKLOADS</text>
  <text x="24" y="190" fill="#cbd5e1" font-size="13">Pods</text>
  <text x="24" y="212" fill="#cbd5e1" font-size="13">Deployments</text>
  <text x="24" y="234" fill="#cbd5e1" font-size="13">Jobs</text>
  <text x="24" y="256" fill="#cbd5e1" font-size="13">CronJobs</text>

  <!-- Main content area -->
  <!-- Header -->
  <text x="220" y="36" fill="#111827" font-size="20" font-weight="bold">Cluster Dashboard</text>
  <text x="220" y="54" fill="#6b7280" font-size="12">Real-time overview of your Kubernetes cluster</text>

  <!-- Stats Cards Row -->
  <!-- Pods Card -->
  <rect x="220" y="72" width="170" height="80" fill="#fff" rx="8" filter="url(#shadow)"/>
  <text x="236" y="96" fill="#6b7280" font-size="11">Pods</text>
  <text x="236" y="124" fill="#16a34a" font-size="28" font-weight="bold">24/24</text>
  <text x="236" y="142" fill="#16a34a" font-size="11">All healthy</text>

  <!-- Deployments Card -->
  <rect x="400" y="72" width="170" height="80" fill="#fff" rx="8" filter="url(#shadow)"/>
  <text x="416" y="96" fill="#6b7280" font-size="11">Deployments</text>
  <text x="416" y="124" fill="#eab308" font-size="28" font-weight="bold">11/12</text>
  <text x="416" y="142" fill="#eab308" font-size="11">1 unhealthy</text>

  <!-- Nodes Card -->
  <rect x="580" y="72" width="170" height="80" fill="#fff" rx="8" filter="url(#shadow)"/>
  <text x="596" y="96" fill="#6b7280" font-size="11">Nodes</text>
  <text x="596" y="124" fill="#16a34a" font-size="28" font-weight="bold">3/3</text>
  <text x="596" y="142" fill="#16a34a" font-size="11">All ready</text>

  <!-- Alerts Card -->
  <rect x="760" y="72" width="170" height="80" fill="#fff" rx="8" filter="url(#shadow)"/>
  <text x="776" y="96" fill="#6b7280" font-size="11">Alerts</text>
  <text x="776" y="124" fill="#dc2626" font-size="28" font-weight="bold">2</text>
  <text x="776" y="142" fill="#dc2626" font-size="11">Active alerts</text>

  <!-- Issues Panel -->
  <rect x="220" y="168" width="360" height="416" fill="#fff" rx="8" filter="url(#shadow)"/>
  <rect x="220" y="168" width="360" height="40" fill="#fff" rx="8"/>
  <line x1="220" y1="208" x2="580" y2="208" stroke="#e5e7eb" stroke-width="1"/>
  <text x="236" y="194" fill="#111827" font-size="14" font-weight="600">Issues Requiring Attention</text>

  <!-- Issue items -->
  <rect x="232" y="220" width="336" height="52" fill="#fef2f2" rx="6"/>
  <circle cx="248" cy="240" r="4" fill="#dc2626"/>
  <text x="260" y="238" fill="#dc2626" font-size="10" font-weight="500">Error</text>
  <text x="296" y="238" fill="#111827" font-size="12" font-weight="500">api-server-7b8f9</text>
  <text x="248" y="258" fill="#6b7280" font-size="10">Namespace: production</text>
  <rect x="484" y="230" width="72" height="20" fill="#fecaca" rx="4"/>
  <text x="494" y="244" fill="#dc2626" font-size="10">CrashLoop</text>

  <rect x="232" y="282" width="336" height="52" fill="#fef2f2" rx="6"/>
  <circle cx="248" cy="302" r="4" fill="#dc2626"/>
  <text x="260" y="300" fill="#dc2626" font-size="10" font-weight="500">Error</text>
  <text x="296" y="300" fill="#111827" font-size="12" font-weight="500">worker-node-2x9k</text>
  <text x="248" y="320" fill="#6b7280" font-size="10">Namespace: default</text>
  <rect x="472" y="292" width="84" height="20" fill="#fecaca" rx="4"/>
  <text x="478" y="306" fill="#dc2626" font-size="10">ImagePullErr</text>

  <rect x="232" y="344" width="336" height="52" fill="#fefce8" rx="6"/>
  <circle cx="248" cy="364" r="4" fill="#eab308"/>
  <text x="260" y="362" fill="#ca8a04" font-size="10" font-weight="500">Warning</text>
  <text x="308" y="362" fill="#111827" font-size="12" font-weight="500">nginx-deploy</text>
  <text x="248" y="382" fill="#6b7280" font-size="10">2/3 replicas ready</text>

  <!-- Events Panel -->
  <rect x="590" y="168" width="340" height="416" fill="#fff" rx="8" filter="url(#shadow)"/>
  <rect x="590" y="168" width="340" height="40" fill="#fff" rx="8"/>
  <line x1="590" y1="208" x2="930" y2="208" stroke="#e5e7eb" stroke-width="1"/>
  <text x="606" y="194" fill="#111827" font-size="14" font-weight="600">Recent Events</text>

  <!-- Event items -->
  <circle cx="612" cy="230" r="4" fill="#22c55e"/>
  <text x="624" y="228" fill="#374151" font-size="11" font-weight="500">Pulled</text>
  <text x="670" y="228" fill="#9ca3af" font-size="10">Pod/api-server-7b8f9</text>
  <text x="624" y="242" fill="#6b7280" font-size="10">Successfully pulled image "api:v2.1"</text>

  <circle cx="612" cy="264" r="4" fill="#facc15"/>
  <text x="624" y="262" fill="#374151" font-size="11" font-weight="500">BackOff</text>
  <text x="680" y="262" fill="#9ca3af" font-size="10">Pod/worker-node-2x9k</text>
  <text x="624" y="276" fill="#6b7280" font-size="10">Back-off restarting failed container</text>
  <rect x="896" y="254" width="28" height="18" fill="#f3f4f6" rx="4"/>
  <text x="902" y="266" fill="#6b7280" font-size="10">x5</text>

  <circle cx="612" cy="298" r="4" fill="#22c55e"/>
  <text x="624" y="296" fill="#374151" font-size="11" font-weight="500">Scheduled</text>
  <text x="692" y="296" fill="#9ca3af" font-size="10">Pod/batch-job-abc</text>
  <text x="624" y="310" fill="#6b7280" font-size="10">Successfully assigned to node-1</text>

  <circle cx="612" cy="332" r="4" fill="#22c55e"/>
  <text x="624" y="330" fill="#374151" font-size="11" font-weight="500">ScalingUp</text>
  <text x="696" y="330" fill="#9ca3af" font-size="10">Deploy/frontend</text>
  <text x="624" y="344" fill="#6b7280" font-size="10">Scaled up replica set frontend-5d8c to 3</text>

  <circle cx="612" cy="366" r="4" fill="#facc15"/>
  <text x="624" y="364" fill="#374151" font-size="11" font-weight="500">FailedMount</text>
  <text x="704" y="364" fill="#9ca3af" font-size="10">Pod/data-proc-1</text>
  <text x="624" y="378" fill="#6b7280" font-size="10">Unable to attach volume "pvc-data"</text>

  <circle cx="612" cy="400" r="4" fill="#22c55e"/>
  <text x="624" y="398" fill="#374151" font-size="11" font-weight="500">Created</text>
  <text x="676" y="398" fill="#9ca3af" font-size="10">Pod/cron-cleanup-xyz</text>
  <text x="624" y="412" fill="#6b7280" font-size="10">Created container cleanup</text>
</svg>
