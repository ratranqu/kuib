<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 180" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="740" height="180" fill="#fff" rx="8" filter="url(#shadow)"/>

  <!-- Header -->
  <text x="24" y="32" fill="#111827" font-size="14" font-weight="600">Run History</text>
  <line x1="0" y1="44" x2="740" y2="44" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Timeline bars - Jenkins style -->
  <!-- Bars aligned to bottom at y=130 -->
  <rect x="24" y="62" width="12" height="68" fill="#22c55e" rx="2"/>
  <rect x="42" y="70" width="12" height="60" fill="#22c55e" rx="2"/>
  <rect x="60" y="90" width="12" height="40" fill="#22c55e" rx="2"/>
  <rect x="78" y="58" width="12" height="72" fill="#dc2626" rx="2"/>
  <rect x="96" y="82" width="12" height="48" fill="#22c55e" rx="2"/>
  <rect x="114" y="74" width="12" height="56" fill="#22c55e" rx="2"/>
  <rect x="132" y="66" width="12" height="64" fill="#22c55e" rx="2"/>
  <rect x="150" y="110" width="12" height="20" fill="#22c55e" rx="2"/>
  <rect x="168" y="86" width="12" height="44" fill="#dc2626" rx="2"/>
  <rect x="186" y="78" width="12" height="52" fill="#22c55e" rx="2"/>
  <rect x="204" y="94" width="12" height="36" fill="#22c55e" rx="2"/>
  <rect x="222" y="70" width="12" height="60" fill="#22c55e" rx="2"/>
  <rect x="240" y="62" width="12" height="68" fill="#22c55e" rx="2"/>
  <rect x="258" y="98" width="12" height="32" fill="#22c55e" rx="2"/>
  <rect x="276" y="82" width="12" height="48" fill="#22c55e" rx="2"/>
  <rect x="294" y="54" width="12" height="76" fill="#dc2626" rx="2"/>
  <rect x="312" y="74" width="12" height="56" fill="#22c55e" rx="2"/>
  <rect x="330" y="102" width="12" height="28" fill="#22c55e" rx="2"/>
  <rect x="348" y="86" width="12" height="44" fill="#22c55e" rx="2"/>
  <rect x="366" y="66" width="12" height="64" fill="#22c55e" rx="2"/>
  <rect x="384" y="114" width="12" height="16" fill="#eab308" rx="2"/>

  <!-- Baseline -->
  <line x1="20" y1="130" x2="400" y2="130" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4"/>

  <!-- Legend -->
  <rect x="24" y="148" width="12" height="12" fill="#22c55e" rx="2"/>
  <text x="42" y="159" fill="#6b7280" font-size="11">Succeeded</text>
  <rect x="120" y="148" width="12" height="12" fill="#dc2626" rx="2"/>
  <text x="138" y="159" fill="#6b7280" font-size="11">Failed</text>
  <rect x="196" y="148" width="12" height="12" fill="#eab308" rx="2"/>
  <text x="214" y="159" fill="#6b7280" font-size="11">Active/Unknown</text>
  <text x="640" y="159" fill="#9ca3af" font-size="11">21 runs</text>
</svg>
